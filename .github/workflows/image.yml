# Tests and builds the SD card image and the apps' archives on every push
# and pull request. On pushes to the default branch, and every day, it
# publishes them as the "latest" release: README.md's download link, and
# where Settings downloads the app catalogue (apps.json), the apps and
# updates (os.json and dazzle-os.tar.xz). A build always takes the
# Raspberry Pi kernel's latest commit, so the daily one brings installed
# systems its latest fixes. See ARCHITECTURE.md, Updates.
name: Image

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # Every day, for the kernel's latest fixes.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the kernel's build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu flex bison bc

      # The kernel is the Raspberry Pi kernel's latest commit (its default
      # branch), which the build fetches.
      - name: Find the latest Raspberry Pi kernel
        id: pins
        run: echo "linux=$(git ls-remote https://github.com/raspberrypi/linux.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      # The kernel is most of a build: keep its source and its build
      # directory, so a new commit only fetches and rebuilds what changed.
      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: build/zig
          key: zig-${{ runner.os }}-${{ hashFiles('scripts/zig') }}
      - name: Cache the Linux source
        uses: actions/cache@v4
        with:
          path: build/linux-rpi
          key: linux-rpi-source-${{ steps.pins.outputs.linux }}
          restore-keys: linux-rpi-source-
      - name: Cache the kernel build
        uses: actions/cache@v4
        with:
          path: build/kernel
          key: kernel-rpi-${{ runner.os }}-${{ steps.pins.outputs.linux }}-${{ hashFiles('kernel/*.config') }}
          restore-keys: kernel-rpi-${{ runner.os }}-
      - name: Cache the firmware
        uses: actions/cache@v4
        with:
          path: build/firmware
          key: firmware-${{ hashFiles('build.zig') }}
          restore-keys: firmware-

      - name: Test
        run: scripts/zig build test --summary new

      - name: Build the image
        env:
          DAZZLE_SIGNING_KEY: ${{ secrets.DAZZLE_SIGNING_KEY }}
        run: scripts/build

      - name: Compress the image
        run: |
          mkdir dist
          xz -T0 -9 -c zig-out/dazzle.img > dist/dazzle.img.xz
          (cd dist && sha256sum dazzle.img.xz > dazzle.img.xz.sha256)
          # The apps' archives, icons and catalogue, which Settings downloads
          # from beside the image.
          cp zig-out/apps/* dist/
          # The system as an update, its icon and manifest, which Settings
          # checks for newer systems.
          cp zig-out/os/* dist/
          ls -l dist

      # Handed to the publish job (and kept a day: the release keeps
      # them).
      - uses: actions/upload-artifact@v4
        with:
          name: dazzle-image
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dazzle-image
          path: dist

      # One release, "latest", replaced by each build: its download link
      # stays the same.
      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          cat > notes.md <<NOTES
          The latest build of Dazzle, from commit $short ($(date -u +%Y-%m-%d)).

          Write \`dazzle.img.xz\` to a microSD card with Raspberry Pi Imager
          (Choose OS, then Use Custom); see the [README](https://github.com/$GH_REPO#installing).
          NOTES
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* \
            --target "$GITHUB_SHA" --title "Dazzle (latest build, $short)" \
            --notes-file notes.md --latest

      # Each build's update (the system, its icon and manifest) and its
      # catalogue of language packs, also as a release of its own, tagged
      # by its commit, which the store (dazzleos/store) lists: its files
      # stay as they are (the latest release's are replaced by the next
      # build's). Not the image. The ten newest are kept.
      - name: A release of this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          tag="build-$short"
          files=$(ls dist/* | grep -v '/dazzle\.img\.xz')
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" $files \
            --target "$GITHUB_SHA" --title "Dazzle (build $short)" \
            --notes "The update and language packs built from commit $short, as dazzleos/store lists them." --latest=false
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done

      # The store lists this build at once (not at its next scheduled run,
      # which GitHub often runs late or not at all). STORE_TOKEN: a token
      # that may start dazzleos/store's workflows; without it, the store
      # lists the build when it next runs.
      - name: Have the store list it
        env:
          GH_TOKEN: ${{ secrets.STORE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No STORE_TOKEN: the store lists this build when it next runs"
            exit 0
          fi
          gh workflow run store.yml -R dazzleos/store
